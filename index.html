id:'2.1.1',title:'约束及其分类',page:37,group:'约束',model:'pend',scene:'定长摆的几何约束',intro:'转动摆杆，观察摆球的可达位置。两个坐标怎样被一根杆联系起来？',
steps:[['选定参考系','令铰点为原点，x 向右、y 向上。质点原可在平面内任意移动。','r = (x, y)'],['写出杆长不变','刚性细杆的两端始终相距 ℓ。允许位置构成一个圆。','x² + y² = ℓ²'],['判断约束类型','关系只含位置，且没有显含时间，是完整、定常的几何约束。若 ℓ 随给定时间改变，该约束便是非定常的。若速度限制无法积分成位置关系，则属于非完整约束。','x = ℓ sin θ，y = −ℓ cos θ']],
qs:[['刚性定长杆连接平面质点和固定铰点，摆球允许的位置构成什么？',['圆周','圆盘内部','竖直直线'],0,'定长要求到铰点的距离始终等于杆长。'],['若杆长由电机给定为 ℓ(t)，这个位置约束属于哪一类？',['定常完整','非定常完整','只限制加速度'],1,'它仍可写成位置与时间的等式，其中显含时间。'],['杆长 5 m，摆球位于铰点下方且 x = 3 m。以向上为 y 正向，求 y（m）。',null,-4,'由 y² = 25 − 9 = 16，下半圆对应负根。'],['细绳可松弛，长 ℓ。用 r 表示球到悬点的距离，哪个条件覆盖所有允许位置？',['r ≥ ℓ','r = ℓ','r ≤ ℓ'],2,'绷紧时取等号，松弛时两端距离可小于绳长。']]
},{
id:'2.1.2',title:'约束力',page:41,group:'约束',model:'normal',scene:'斜面的法向支持力',intro:'改变倾角和质量，观察重力的法向分量，以及光滑斜面如何限制滑块的运动。',
steps:[['确定受力','滑块贴着固定光滑斜面滑动，只受重力与垂直接触面的支持力。','F = mg + N（矢量相加）'],['沿法向投影','取离开斜面的方向为正。沿直斜面的法向加速度为零。','N − mg cos α = 0'],['消去支持力','沿斜面向下取正，支持力在这个方向没有分量。','N = mg cos α，a = g sin α']],
qs:[['光滑平面给接触滑块的力指向何处？',['沿运动方向','垂直接触面','竖直向上'],1,'光滑接触没有切向摩擦，支持力沿法向。'],['斜面倾角增大，质量一定且滑块保持接触，法向力如何变化？',['增大','不变','减小'],2,'N = mg cos α，锐角范围内余弦随角度增大而减小。'],['m = 2 kg，g = 10 m/s²，斜面倾角 60°，求 N（N）。',null,10,'法向投影给出 N = 2 × 10 × cos 60° = 10 N。'],['若斜面沿自身法向加速，滑块仍贴面运动，旧公式需要重新检查哪一步？',['法向加速度为零','重力沿竖直向下','光滑面无摩擦'],0,'滑块跟随移动斜面取得法向加速度，应写 N − mg cos α = maₙ。']]
},{
id:'2.1.3',title:'约束使问题复杂',page:41,group:'约束',model:'pulley',scene:'两物体与同一根绳',intro:'调节一端重物的位置。绳长会把两个坐标联系起来，而绳张力又把两个受力方程联系起来。',
steps:[['分别选坐标','定滑轮两侧以向下为正；忽略绳的质量和伸长，以及滑轮的质量和摩擦。','y₁ + y₂ = 常量'],['分别写动力学方程','对理想定滑轮，两端绳张力大小相等。此时未知量是两个加速度与一个张力。','m₁a₁ = m₁g − T，m₂a₂ = m₂g − T'],['补上几何关系','绳长关系对时间求导两次，给出第三个方程。代入消去张力。','a₂ = −a₁，a₁ = (m₁ − m₂)g / (m₁ + m₂)']],
qs:[['轻绳跨过理想定滑轮、两端各挂一物。分别列牛顿方程时，哪个内部联系量同时出现？',['空气阻力','支持面倾角','绳张力'],2,'绳对两端物体都施加张力，理想条件下张力大小相同。'],['两侧坐标均向下为正，若左端下降 3 cm，右端位移为多少 cm？',null,-3,'总绳长不变，Δy₂ = −Δy₁。'],['左端 3 kg，右端 2 kg，取 g = 10 m/s²。左端向下加速度为多少 m/s²？',null,2,'a₁ = (3 − 2) × 10 / (3 + 2) = 2。'],['取左端坐标作为唯一广义坐标，两端张力在相容虚位移上的总虚功怎样？',['相消为零','总为正','等于两倍左端张力的虚功'],0,'两张力都向上，两个向下坐标的变分互为相反数，故 −T(δy₁ + δy₂) = 0。']]
},{
id:'2.2',title:'自由度与广义坐标',page:44,group:'自由度与广义坐标',model:'pend',scene:'用一个角描述平面单摆',intro:'试着只改变摆角。给定杆长后，每个角度都对应唯一的一对平面坐标。',
steps:[['数出原始坐标','平面内的一个点原先需要两个笛卡儿坐标。','N = 2'],['扣除独立约束','一个独立完整约束使两个坐标不能任意选取。对正则完整系统，在局部做此计数。','s = N − k = 2 − 1 = 1'],['选取独立变量','角度 q = θ 可在局部描述圆周上的所有位形，广义坐标的量纲也可以是角度。','r(θ) = (ℓ sin θ, −ℓ cos θ)']],
qs:[['定长平面单摆需要几个独立坐标？',null,1,'两个平面坐标减去一个独立杆长约束，得到一个自由度。'],['平面双摆的两杆长度固定，两个摆角可独立变化。哪组量可作广义坐标？',['两个固定杆长','两个摆角','重力和时间'],1,'两个摆角给出两根杆的取向，进而确定两个质点的位置。'],['空间中两个质点由一根定长刚杆连接，无其他约束。自由度是多少？',null,5,'两个空间点共有六个坐标，减去一个独立距离约束。'],['已有 x² + y² = ℓ²，再写 2x² + 2y² = 2ℓ²。自由度是否再少一个？',['是，多了一个方程','取决于单位','否，两式相关'],2,'只有独立关系才能再消去一个坐标。']]

  angularMomentum:['角动量 J','kg·m²/s',-6,6,4,0.2],
  speed:['沿刀滑速 u','m/s',0,5,3,0.1],
  turn:['转向角速度 θ̇','rad/s',-2,2,0.5,0.1],
  vx:['水平速度 vₓ','m/s',-5,5,3,0.5],
  vy:['竖直速度 vᵧ','m/s',-5,5,-4,0.5]
});
Object.assign(knobs, {
  drive:['angle','pivot','length'], bead:['radius','omega'],
  polar:['radius','angularMomentum'], blade:['angle','speed','turn'], magnetic:['vx','vy']
});

const addedModels = {
  drive: {
    note:'悬点沿水平方向移动 · g = 9.8 m/s²',
    read(p) {
      const t = p.angle*deg;
      return [['∂ẋ/∂θ̇',p.length*Math.cos(t),'m'],
        ['角加速度 θ̈',-(9.8*Math.sin(t)+p.pivot*Math.cos(t))/p.length,'rad/s²']];
    }
  },
  bead: {
    note:'m = 1 kg · k = 4 N/m · r₀ = 0.6 m · ṙ = 0 的瞬时截面',
    read(p) {
      const spring = 2*(p.radius-0.6)**2;
      const tangential = 0.5*(p.radius*p.omega)**2;
      return [['径向加速度',p.omega**2*p.radius-4*(p.radius-0.6),'m/s²'],
        ['广义能量 Eᴸ',spring-tangential,'J'],['机械能 Eₘ',spring+tangential,'J']];
    }
  },
  polar: {
    note:'m = 1 kg · 方位示意 · 横向箭头表示有符号的切向速度',
    read(p) {
      return [['角速度 φ̇',p.angularMomentum/p.radius**2,'rad/s'],
        ['切向速度',p.angularMomentum/p.radius,'m/s'],['角动量 J',p.angularMomentum,'kg·m²/s']];
    }
  },
  blade: {
    note:'m = 2 kg · 绿色为速度 · 橙色为侧向约束力',
    read(p) {
      return [['侧向约束力',2*p.speed*p.turn,'N'],['约束力功率',0,'W']];
    }
  },
  magnetic: {
    note:'俯视 xy 平面 · eB = 2 N·s/m · 绿色为速度 · 橙色为磁力',
    read(p) {
      return [['磁力 Qₓ',2*p.vy,'N'],['磁力 Qᵧ',-2*p.vx,'N'],['磁力功率',0,'W']];
    }
  }
};

function drawAddedModel(canvas, lesson, p) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const density = window.devicePixelRatio || 1;
  canvas.width = Math.round(w*density);
  canvas.height = Math.round(h*density);
  const c = canvas.getContext('2d');
  const s = Math.min(w/360,h/200);
  c.scale(density*s,density*s);
  c.translate(w/(2*s),h/(2*s));
  const mint = '#a1eed1', amber = '#ffc075', pale = '#e1f5ea', dim = '#729b8e';
  function line(x,y,a,b,color=pale,thickness=2) {
    c.strokeStyle=color;
    c.lineWidth=thickness;
    c.beginPath(); c.moveTo(x,y); c.lineTo(a,b); c.stroke();
  }
  function dot(x,y,color=mint,r=6) {
    c.fillStyle=color;
    c.beginPath(); c.arc(x,y,r,0,2*Math.PI); c.fill();
  }
  function label(text,x,y,color=pale) {
    c.fillStyle=color; c.font='16px sans-serif'; c.fillText(text,x,y);
  }
  function arrow(text,x,y,dx,dy,color) {
    if (Math.hypot(dx,dy)<2) return;
    const a=x+dx,b=y+dy,angle=Math.atan2(dy,dx);
    line(x,y,a,b,color,2.5);
    line(a,b,a-8*Math.cos(angle-.5),b-8*Math.sin(angle-.5),color);
    line(a,b,a-8*Math.cos(angle+.5),b-8*Math.sin(angle+.5),color);
    label(text,a+5,b-5,color);
  }
  if (lesson.model==='drive') {
    const t=p.angle*deg, length=p.length*70;
    line(-119,-55,119,-55,dim);
    line(0,-52,length*Math.sin(t),-52+length*Math.cos(t));
    dot(0,-52,pale); dot(length*Math.sin(t),-52+length*Math.cos(t));
    arrow('A',0,-69,p.pivot*9,0,amber);
    label('θ',13,-20,amber);
    return;
  }
  if (lesson.model==='blade') {
    const t=p.angle*deg, x=Math.cos(t), y=-Math.sin(t);
    line(-68*x,-68*y,68*x,68*y,pale,5); dot(0,0,pale);
    arrow('v',0,0,17*p.speed*x,17*p.speed*y,mint);
    arrow('F⊥',0,0,9*p.turn*p.speed*y,-9*p.turn*p.speed*x,amber);
    return;
  }
  line(-135,0,135,0,dim); line(0,83,0,-83,dim);
  label('x',142,5,dim); label('y',5,-78,dim);
  if (lesson.model==='magnetic') {
    dot(0,0,pale);
    arrow('v',0,0,12*p.vx,-12*p.vy,mint);
    arrow('F',0,0,12*p.vy,12*p.vx,amber);
    return;
  }
  const r=50*p.radius;
  dot(0,0,pale,4);
  line(0,0,r,0,pale,lesson.model==='bead'?5:2);
  dot(r,0); label('r',r/2,23);
  if (lesson.model==='bead') {
    arrow('Ωr',r,0,0,-10*p.omega*p.radius,mint);
    const radial=addedModels.bead.read(p)[0][1];
    arrow('aᵣ',r,0,Math.max(-55,Math.min(55,radial*8)),0,amber);
  } else {
    const tangential=p.angularMomentum/p.radius;
    arrow('vφ',r,0,0,Math.max(-72,Math.min(72,-16*tangential)),mint);
  }
}

Object.assign(facts,Object.fromEntries(Object.entries(addedModels).map(([id,model])=>[id,model.note])));
Object.assign(guide,{
  '3.1.1':'改变摆角和摆长，观察拉格朗日关系中的偏导。只调悬点加速度时，这个偏导会动吗？',
  '3.1.2':'把摆角设为 0°，改变悬点加速度的方向。摆角加速度往哪边变？',
  '3.1.3':'固定半径，逐渐提高角速度，比较径向加速度的大小和符号。',
  '3.2.1':'保持角动量不变，把半径减半。角速度和切向速度各变成几倍？',
  '3.2.2':'保持 Ω 不变，改变 r。比较机械能与广义能量之间的差，留意画面显示的是 ṙ = 0 的不同瞬时状态。',
  '3.2.3':'固定 J，改变 r。比较切向速度和角速度，体会守恒量如何约束速度。',
  '3.3':'先把转向角速度设为 0，再改成正值和负值。侧向力怎么变？功率呢？',
  '3.4':'分别调节两个速度分量，核对磁力与速度是否始终正交。'
});

const key='liang-mechanics-ch2-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
let records=saved.records&&typeof saved.records==='object'?saved.records:{};
let idx=Math.max(0,lessons.findIndex(l=>l.id===saved.section)),tab='model',view='desk',step=0,qi=0,choice=null,feedback=null,param=defaults(lessons[idx].model),mobileNav=false,observer=null,storageOK=true;
function save(){try{localStorage.setItem(key,JSON.stringify({section:lessons[idx].id,records}))}catch{storageOK=false}}
function idq(i=idx,j=qi){return lessons[i].id+'#'+j}
function resolved(i){return lessons[i].qs.reduce((n,_,j)=>n+(records[idq(i,j)]?.passed?1:0),0)}
function totalWrong(){return Object.values(records).filter(r=>r?.wrong).length}
function stats(){
 const chapter = chapterOf(lessons[idx]);
 const metadata = chapters[chapter];
 const activeLessons = lessons.filter(lesson => chapterOf(lesson) === chapter);
 const total = activeLessons.reduce((sum,lesson) => sum + lesson.qs.length,0);
 const n = lessons.reduce((sum,lesson,i) => sum + (chapterOf(lesson) === chapter ? resolved(i) : 0),0);
 const percent = Math.round(100*n/total);
 $('#chapter-name').textContent = metadata.name;
 $('#chapter-title').textContent = metadata.title;
 $('#chapter-pages').textContent = '第 '+metadata.pages+' 页';
 $('#chapter-switch').innerHTML = Object.entries(chapters).map(([id,info]) =>
   '<button type="button" class="secondary" data-chapter="'+id+'" aria-pressed="'+(id===chapter)+'">'+info.name+' · '+info.title+'</button>'
 ).join('');
 document.querySelectorAll('[data-chapter]').forEach(button => {
   button.onclick = () => selectLesson(lessons.findIndex(lesson => chapterOf(lesson) === button.dataset.chapter));
 });
 $('#bar').style.width=percent+'%';$('#percent').textContent=percent+'%';$('#count').textContent=n+' / '+total+' 题已答对'+(storageOK?' · 进度保存在此浏览器':' · 浏览器暂时无法保存进度');
 $('#desk').innerHTML=ic('work')+'学习工作台';$('#mistakes').innerHTML=ic('note')+'错题本'+(totalWrong()?' <b>'+totalWrong()+'</b>':'');
 $('#desk').classList.toggle('current',view==='desk');$('#mistakes').classList.toggle('current',view==='errors');
 $('#asideHead').innerHTML=ic('list')+'<strong>章节目录</strong><span>'+activeLessons.length+' 节</span><button id="toggleNav" aria-expanded="'+mobileNav+'">'+(mobileNav?'收起':'展开')+'</button>';$('#toggleNav').onclick=()=>{mobileNav=!mobileNav;stats()};
 $('#sections').classList.toggle('expanded',mobileNav);
 $('#sections').innerHTML=groups.filter(([prefix])=>prefix.startsWith(chapter+'.')).map(([prefix,title])=>'<div class="groupTitle"><b>§ '+prefix+'</b> '+title+'</div>'+lessons.map((l,i)=>l.group===title?'<button class="lesson '+(idx===i&&view==='desk'?'sel':'')+'" data-i="'+i+'" '+(idx===i&&view==='desk'?'aria-current="page"':'')+'><span>'+ (resolved(i)===l.qs.length?ic('tick'):'<i></i>')+'</span><div><small>'+l.id+'</small> '+(short[l.id]||l.title)+'</div></button>':'').join('')).join('');
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>selectLesson(+b.dataset.i));
}
function selectLesson(i,newTab='model',q=0){idx=i;tab=newTab;qi=q;step=0;choice=null;feedback=null;param=defaults(lessons[i].model);view='desk';mobileNav=false;save();render();if(window.innerWidth<=800)$('#content').scrollIntoView({block:'start'})}
function render(){
 if(observer)observer.disconnect();stats();if(view==='errors'){renderErrors();return}
 const l=lessons[idx];$('#content').innerHTML='<article class="sheet"><div class="lessonHead"><div class="unitLine"><span>§ '+l.id+'</span><span class="pg">'+ic('book')+'教材第 '+l.page+' 页</span></div><h2>'+l.title+'</h2><p>'+l.intro+'</p></div><div class="tabs" aria-label="学习方式">'+[['model','lab','互动模型'],['steps','steps','逐步推导'],['quiz','pen','分级练习']].map(([v,k,t])=>'<button data-tab="'+v+'" class="'+(tab===v?'active':'')+'" aria-pressed="'+(tab===v)+'">'+ic(k)+t+'</button>').join('')+'</div><div id="pane"></div></article>';
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 if(tab==='model')renderModel();if(tab==='steps')renderSteps();if(tab==='quiz')renderQuiz();
}
function renderModel(){
 const l=lessons[idx];const draw=addedModels[l.model]?drawAddedModel:drawModel;$('#pane').innerHTML='<div class="board"><div class="boardTitle"><span class="cross">✛</span>'+l.scene+'</div><canvas aria-label="'+l.scene+'"></canvas><div class="boardFoot">'+facts[l.model]+'</div></div><div class="controls"><div class="row"><h3>'+ic('tune')+'实验参数</h3><button id="reset" class="textBtn">'+ic('reset')+'复位</button></div><div class="sliders">'+knobs[l.model].map(k=>{const [title,unit,min,max,v,step]=specs[k];return '<label><span>'+title+'<output id="o-'+k+'"></output></span><input aria-label="'+title+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+param[k]+'" data-k="'+k+'"></label>'}).join('')+'</div><div class="results" id="readout"></div></div><div class="prompt"><span>'+ic('bulb')+'观察任务</span><p>'+guide[l.id]+'</p></div>';
 function update(){for(const k of knobs[l.model]){const [title,unit,min,max,v,step]=specs[k];$('#o-'+k).textContent=Number(param[k]).toFixed(step<0.1?2:step<1?1:0)+' '+unit;const input=document.querySelector('[data-k="'+k+'"]');input.style.setProperty('--fill',((param[k]-min)/(max-min)*100)+'%')}$('#readout').innerHTML=(addedModels[l.model]?.read(param) ?? modelData(l,param)).map(([a,b,u])=>'<div><span>'+a+'</span><strong>'+format(b)+' <small>'+u+'</small></strong></div>').join('');draw($('canvas'),l,param)}
 document.querySelectorAll('[data-k]').forEach(s=>s.oninput=()=>{param[s.dataset.k]=+s.value;update()});$('#reset').onclick=()=>{param=defaults(l.model);for(const k of knobs[l.model])document.querySelector('[data-k="'+k+'"]').value=param[k];update()};update();
 if(window.ResizeObserver){observer=new ResizeObserver(()=>{const c=$('canvas');if(c)draw(c,l,param)});observer.observe($('canvas'))}
}
function renderSteps(){
 const l=lessons[idx];$('#pane').innerHTML='<div class="row paneTitle"><h3>从模型到方程</h3><span>第 '+(step+1)+' / '+l.steps.length+' 步</span></div>'+l.steps.slice(0,step+1).map(([t,d,f],n)=>'<section class="step"><div class="stepnum">'+(n+1)+'</div><div><h3>'+t+'</h3><p>'+d+'</p><div class="formula">'+f+'</div></div></section>').join('')+'<div class="actions"><button class="secondary" id="prev" '+(!step?'disabled':'')+'>上一步</button><button class="primary" id="next">'+(step===l.steps.length-1?'进入本节练习':'展开下一步')+'</button></div>';
 $('#prev').onclick=()=>{step--;renderSteps()};$('#next').onclick=()=>{if(step<l.steps.length-1){step++;renderSteps()}else{tab='quiz';render()}};
}
function gotoQuestion(n){qi=n;choice=null;feedback=null;renderQuiz()}
function questionLevel(question, index) {
  return question[4]?.fields ? '综合挑战' : levels[index];
}

function nextLessonInChapter() {
  const next = lessons[idx+1];
  return next?.id.startsWith(chapterOf(lessons[idx]) + '.') ? idx+1 : -1;
}

function renderQuiz() {
  const lesson = lessons[idx];
  const entry = lesson.qs[qi];
  const [question, options, answer, explanation, challenge] = entry;
  const fields = challenge?.fields;
  const correctAt = (value, target) => Math.abs(value-target) <= (challenge?.tolerance ?? 1e-6*Math.max(1,Math.abs(target)));
  const formFields = options
    ? '<div class="choices">' + options.map((option,i) => '<label class="option"><input type="radio" name="ans" value="'+i+'" '+(choice===i?'checked':'')+' required><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+option+'</span></label>').join('') + '</div>'
    : (fields ?? ['填写数值（单位见题干）']).map((field,i) =>
        '<label class="numLabel">'+field+'<input id="answer-'+i+'" type="number" step="any" required placeholder="输入数值" inputmode="decimal"></label>'
      ).join('');
  $('#pane').innerHTML = '<div class="row paneTitle"><h3>本节练习</h3><span>已答对 '+resolved(idx)+' / '+lesson.qs.length+' 题</span></div>'
    + '<div class="qnav">'+lesson.qs.map((_,i)=>'<button data-q="'+i+'" class="'+(qi===i?'on ':'')+(records[idq(idx,i)]?.passed?'done':'')+'" aria-label="第 '+(i+1)+' 题">第 '+(i+1)+' 题'+(records[idq(idx,i)]?.passed?' ✓':'')+'</button>').join('')+'</div>'
    + '<form id="quizForm"><div class="qtags"><b>'+questionLevel(entry,qi)+'</b><span>'+(fields?'多步数值题':options?'单项选择':'数值填空')+'</span></div><h3 class="question">'+question+'</h3>'
    + (challenge ? '<p class="answer-note">按给定单位填写数值'+(challenge.tolerance?'，非整数可四舍五入到小数点后两位':'')+'。</p><details class="quiz-hint"><summary>查看解题提示</summary><p>'+challenge.hint+'</p></details>' : '')
    + formFields + '<div class="actions"><button type="submit" class="primary">提交答案</button>'+(feedback?'<button class="secondary" type="button" id="again">重新作答</button>':'')+'</div></form><div id="feedback" aria-live="polite"></div>';
  if (!options && choice !== null) {
    (Array.isArray(choice) ? choice : [choice]).forEach((value,i) => { $('#answer-'+i).value = value; });
  }
  if (feedback) {
    const results = fields ? '<ol>'+fields.map((field,i) =>
      '<li>'+field+'：'+(feedback.parts[i]?'正确':'需复算，参考值 '+Number(answer[i].toFixed(3)))+'</li>').join('')+'</ol>' : '';
    const correction = feedback.ok || fields ? '' : '正确答案为 '+(options ? String.fromCharCode(65+answer)+'（'+options[answer]+'）' : answer)+'。';
    const moreQuestions = qi+1 < lesson.qs.length;
    const nextLesson = nextLessonInChapter();
    const nextLabel = moreQuestions ? '下一题' : nextLesson >= 0 ? '学习下一节' : '查看错题本';
    $('#feedback').innerHTML = '<div class="feedback '+(feedback.ok?'good':'bad')+'"><strong>'+(feedback.ok?'回答正确':'再看一下这一步')
      +'</strong>'+results+'<p>'+correction+explanation+'</p>'+(feedback.ok?'':'<small>已加入错题本，重新答对此题后自动移出。</small>')
      +'</div><div class="actions"><button id="advance" class="secondary">'+nextLabel+'</button></div>';
    $('#again').onclick = () => gotoQuestion(qi);
    $('#advance').onclick = () => {
      if (moreQuestions) gotoQuestion(qi+1);
      else if (nextLesson >= 0) selectLesson(nextLesson);
      else showErrors();
    };
  }
  document.querySelectorAll('[data-q]').forEach(button => { button.onclick = () => gotoQuestion(+button.dataset.q); });
  $('#quizForm').onsubmit = event => {
    event.preventDefault();
    const values = options
      ? [$('input[name="ans"]:checked')?.value]
      : (fields ?? ['']).map((_,i) => $('#answer-'+i).value);
    if (values.some(value => value == null || value === '' || !Number.isFinite(Number(value)))) return;
    const numbers = values.map(Number);
    const targets = fields ? answer : [answer];
    const parts = numbers.map((value,i) => correctAt(value,targets[i]));
    const ok = parts.every(Boolean);
    choice = fields ? numbers : numbers[0];
    records[idq()] = {passed:ok,wrong:!ok,last:choice};
    feedback = {ok,parts};
    save();
    stats();
    renderQuiz();
  };
}

function lastAnswer(question, record) {
  if (question[1]) return question[1][record.last];
  if (Array.isArray(record.last) && question[4]?.fields) {
    return question[4].fields.map((field,i) => field+' '+record.last[i]).join('；');
  }
  return record.last;
}

function showErrors(){view='errors';mobileNav=false;render();if(window.innerWidth<=800)$('#content').scrollIntoView()}
function renderErrors(){
 const entries=lessons.flatMap((l,i)=>l.qs.map((q,j)=>({l,i,q,j,r:records[idq(i,j)]}))).filter(x=>x.r?.wrong);
 $('#content').innerHTML='<article class="sheet errorSheet"><div class="eyebrow">'+ic('note')+'复习记录</div><h2>错题本</h2><p>按教材顺序重做，答对后自动移出。</p>'+(entries.length?entries.map(({l,i,q,j,r})=>'<div class="errorItem"><small>§ '+l.id+' · 第 '+(j+1)+' 题 · '+questionLevel(q,j)+'</small><h3>'+q[0]+'</h3><p>上次作答　'+lastAnswer(q,r)+'</p><button class="secondary" data-retry="'+i+','+j+'">重做此题</button></div>').join(''):'<div class="empty">'+ic('tick')+'<h3>当前没有待订正的题目</h3><p>练习中答错的题会出现在这里。</p><button class="primary" id="practice">进入本节练习</button></div>')+'</article>';
 document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.retry.split(',').map(Number);selectLesson(i,'quiz',j)});if($('#practice'))$('#practice').onclick=()=>selectLesson(idx,'quiz')
}
$('#desk').onclick=()=>{view='desk';render()};$('#mistakes').onclick=showErrors;$('#brand').onclick=e=>{e.preventDefault();selectLesson(0)};render();

</script>
